[package]
name = "template-project"
version = "0.1.0"
edition = "2024"
description = "A minimal, language-agnostic-friendly Rust project template."
license = "MIT"
repository = "https://github.com/example/template-project"
documentation = "https://docs.rs/template-project"
keywords = ["template"]
categories = ["development-tools"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
