[build-system]
requires = ["setuptools>=82.0.1,<82.1", "setuptools-scm>=10.0.5,<10.1"]
build-backend = "setuptools.build_meta"

[project]
name = "project-template"
dynamic = ["version"]
description = "Graze.ai project template"
readme = "README.md"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.14"
maintainers = [
  { name = "Thomas Price", email = "tom@graze.ai" },
]
dependencies = []

[dependency-groups]
dev = [
  "it2>=0.2.3,<0.2.4 ; sys_platform == 'darwin'",
  "pre-commit>=4.6.0,<4.7.0",
  { include-group = "coverage" },
  { include-group = "lint" },
  { include-group = "testing" },
  { include-group = "typing" },
]
coverage = [
  "diff-cover>=10.3.0,<10.4.0",
  "pytest-cov>=7.1.0,<7.2.0",
]
lint = [
  "ruff>=0.15.20,<0.15.21",
  "uv-sort>=0.7.1,<0.7.2",
]
testing = [
  "pytest-randomly>=4.1.0,<4.2.0",
  "pytest-xdist>=3.8.0,<3.9.0",
  "pytest>=9.1.0,<9.2.0",
]
typing = [
  "basedpyright>=1.39.0,<1.40.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools_scm]
version_scheme = "calver-by-date"
local_scheme = "dirty-tag"
fallback_version = "0.0.1"

[tool.uv]
add-bounds = "minor"
required-version = ">=0.11.23,<0.12"

[tool.ruff]
line-length = 120
target-version = "py314"
# Force exclusions even for explicitly passed files (important for pre-commit)
force-exclude = true
extend-exclude = [
  ".idea",
  ".vscode",
]
fix = false

[tool.ruff.lint]
# Enable rules from multiple tools
select = [
  "ALL",
]

ignore = [
  "ANN", # type annotations (handled by basedpyright)
  "COM812", # missing-trailing-comma (conflicts with formatter)
  "COM819", # prohibited-trailing-comma (conflicts with formatter)
  "D104", # missing-docstring-in-public-package (__init__.py)
  "D206", # docstring-tab-indentation (conflicts with formatter)
  "D300", # triple-single-quotes (conflicts with formatter)
  "E111", # indentation-with-invalid-multiple (conflicts with formatter)
  "E114", # indentation-with-invalid-multiple-comment (conflicts with formatter)
  "E117", # over-indented (conflicts with formatter)
  "E501", # line-too-long (handled by formatter)
  "FIX", # allow fixme comments
  "ISC001", # single-line-implicit-string-concatenation (conflicts with formatter)
  "ISC002", # multi-line-implicit-string-concatenation (conflicts with formatter)
  "Q000", # bad-quotes-inline-string (conflicts with formatter)
  "Q001", # bad-quotes-multiline-string (conflicts with formatter)
  "Q002", # bad-quotes-docstring (conflicts with formatter)
  "Q003", # avoidable-escaped-quote (conflicts with formatter)
  "Q004", # unnecessary-escaped-quote (conflicts with formatter)
  "TD", # allow todo comments
  "TRY", # exception handling style (opinionated)
  "W191", # tab-indentation (conflicts with formatter)
]

# Rules that are safe to fix automatically
fixable = [
  "ALL"
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore *args and **kwargs in docstrings

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "ARG", # unused arguments (fixtures, handler signatures, mocks)
  "D", # docstrings not required in tests
  "PLR0913", # too-many-arguments (mock constructors)
  "PLR2004", # magic-value-comparison (test assertions)
  "S101", # assert (pytest convention)
  "S105", # hardcoded password-string (test fixtures)
  "S106", # hardcoded password-argument (test fixtures)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"
pythonpath = ["."]

[tool.coverage.run]
branch = true
# Uncomment and extend once this project has source packages to measure.
# Without an explicit source list, pytest-cov only tracks files actually
# imported during the test run, so new modules that no test imports are
# invisible to coverage reports — and /check-coverage can't flag them.
# source = ["my_package"]
omit = [
  "**/tests/**",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  'if (typing\.)?TYPE_CHECKING:',
  "raise NotImplementedError",
  "raise AssertionError",
  "def __repr__",
  "if __name__ == .__main__.:",
]

# Use [tool.pyright] (not [tool.basedpyright]) so both checkers read one config:
# basedpyright falls back to [tool.pyright] when [tool.basedpyright] is absent,
# and stock pyright (bundled by most editor/IDE language servers) only reads
# [tool.pyright]. Under [tool.basedpyright], stock pyright couldn't find the uv
# venv (venvPath/venv) and emitted spurious reportMissingImports. basedpyright
# refuses to run if both tables exist.
[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.14"
pythonPlatform = "All"
exclude = [
  ".claude/worktrees/**",
  ".venv/**",
  "**/node_modules/**",
]
# Hook scripts live outside the import path; ``tests/hooks/conftest.py``
# adds these directories to ``sys.path`` at runtime so each hook can be
# imported by module name from its tests. ``.agents/hooks`` holds hooks
# shared with other agent harnesses (Codex); ``.claude/hooks`` holds
# Claude Code-specific ones.
extraPaths = [".agents/hooks", ".claude/hooks"]

# Framework callbacks and handler signatures legitimately have unused params
# (mock callbacks, **kwargs); pytest fixtures look unused to a static checker
# but run via autouse. basedpyright's executionEnvironments can't scope rules
# by glob (pyright #8108, closed not planned), so disable these two reports
# globally rather than enumerating every tests/ dir.
reportUnusedParameter = false
reportUnusedFunction = false
